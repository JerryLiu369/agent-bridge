[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bridge"
version = "0.2.0"
description = "Multi-backend coding-agent session: Pi and Codex behind one Python API"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_bridge*"]

[tool.setuptools.package-data]
"agent_bridge.backends.pi" = ["server.mjs", "package.json"]
